<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title description">

    <title id="title">TabangNow temporary logo</title>

    <desc id="description">
        A blue community safety shield containing a barangay house and emergency cross.
    </desc>

    <defs>
        <linearGradient id="backgroundGradient"
                        x1="76"
                        y1="52"
                        x2="436"
                        y2="460"
                        gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563eb"/>
            <stop offset="1" stop-color="#0f2f5f"/>
        </linearGradient>

        <linearGradient id="shieldGradient"
                        x1="154"
                        y1="126"
                        x2="358"
                        y2="398"
                        gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#dbeafe"/>
        </linearGradient>

        <filter id="shadow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">
            <feDropShadow dx="0"
                          dy="16"
                          stdDeviation="18"
                          flood-color="#0f172a"
                          flood-opacity=".24"/>
        </filter>
    </defs>

    <!-- Main circular badge -->
    <circle cx="256"
            cy="256"
            r="224"
            fill="url(#backgroundGradient)"/>

    <circle cx="256"
            cy="256"
            r="207"
            fill="none"
            stroke="#ffffff"
            stroke-width="8"
            stroke-opacity=".28"/>

    <!-- Community safety shield -->
    <path d="M256 100
             374 144
             V240
             C374 318
             329 381
             256 416
             C183 381
             138 318
             138 240
             V144
             Z"
          fill="url(#shieldGradient)"
          filter="url(#shadow)"/>

    <path d="M256 120
             354 157
             V239
             C354 304
             318 356
             256 389
             C194 356
             158 304
             158 239
             V157
             Z"
          fill="none"
          stroke="#bfdbfe"
          stroke-width="8"/>

    <!-- Barangay house roof -->
    <path d="M185 240
             256 178
             327 240
             H307
             V310
             H205
             V240
             Z"
          fill="#1d4ed8"/>

    <path d="M169 244
             256 166
             343 244
             H318
             L256 190
             L194 244
             Z"
          fill="#0f2f5f"/>

    <!-- Door -->
    <rect x="239"
          y="260"
          width="34"
          height="50"
          rx="5"
          fill="#dbeafe"/>

    <!-- Windows -->
    <rect x="213"
          y="257"
          width="18"
          height="18"
          rx="4"
          fill="#bfdbfe"/>

    <rect x="281"
          y="257"
          width="18"
          height="18"
          rx="4"
          fill="#bfdbfe"/>

    <!-- Emergency cross -->
    <circle cx="327"
            cy="181"
            r="51"
            fill="#ef4444"
            stroke="#ffffff"
            stroke-width="8"/>

    <path d="M316 153
             H338
             V170
             H355
             V192
             H338
             V209
             H316
             V192
             H299
             V170
             H316
             Z"
          fill="#ffffff"/>

    <!-- Helping hands -->
    <path d="M185 327
             C212 347
             230 354
             256 354
             C282 354
             300 347
             327 327"
          fill="none"
          stroke="#38bdf8"
          stroke-width="18"
          stroke-linecap="round"/>

    <circle cx="179"
            cy="322"
            r="11"
            fill="#38bdf8"/>

    <circle cx="333"
            cy="322"
            r="11"
            fill="#38bdf8"/>
</svg>